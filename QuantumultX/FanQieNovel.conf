# 番茄小说 @zqzess
# 对应小火箭模块：Shadowrocket/module/FanQieNovel.module
# 用法：Quantumult X「重写」-> 「远程」，作为 rewrite_remote 引入；并在主配置启用 MITM 覆盖下方 hostname。
#
# 与模块的差异：
# - 动作由 Surge 系的 `_ reject` 改为圈X 的 `url reject`。
# - 原 [MITM] hostname 去掉 %APPEND%，改为圈X 裸 hostname 行。
#
# 共用素材 CDN（byteimg/douyinpic/ecombdimg/pstatp/pglstatp）按广告路径拒绝，
# 同节点正常封面/头像/商品图不受影响；必须 MITM 覆盖对应域名才能命中 HTTPS，否则路径规则静默失效。

hostname = *.pangolin-sdk-toutiao.*, *.pstatp.com, *.pglstatp-toutiao.com, *.byteimg.com, *.douyinpic.com, *.ecombdimg.com, gurd.snssdk.com, *default.ixigua.com

# 共用素材 CDN 上的广告素材
^https?:\/\/[^\/]+\.(byteimg|douyinpic|ecombdimg|pstatp|pglstatp-toutiao)\.com\/(obj|img)\/(ad|ad-app-package|ad-pattern|web\.business\.image)\/.* url reject
^https?:\/\/[^\/]+\.(byteimg|douyinpic|ecombdimg|pstatp|pglstatp-toutiao)\.com\/.*[?&](from|source)\=ad(&|$) url reject

# 签名图节点（.list 侧已按 DOMAIN-SUFFIX 整域 REJECT，此处按路径兜底）
^https?:\/\/p3-ad-sign\.byteimg\.com\/.* url reject

# 穿山甲 SDK 广告接口
^https?:\/\/.+\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/ url reject
^https?:\/\/.+\.pglstatp-toutiao\.com\/.+\/toutiao\.mp4 url reject

# 头条 / 抖音
^https?:\/\/gurd\.snssdk\.com\/src\/server\/v3\/package url reject
^https?:\/\/.+\.pstatp\.com\/obj\/mosaic-legacy\/.+\?from\=ad url reject
^https?:\/\/.+\.pstatp\.com\/bytecom\/resource\/track_log\/src\/.+ url reject
^https?:\/\/.+\.snssdk\.com\/video\/play\/1\/toutiao\/.+\/mp4 url reject
^https?:\/\/.+\.snssdk\.com\/api\/ad\/.+ url reject

# 图片
^https?:\/\/.+\.byteimg\.com\/tos-cn-i-1yzifmftcy\/(.+)-jpeg\.jpeg url reject
